<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#323437" />
    <meta name="description" content="cubetype — a minimal, fast speedcubing timer." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>cubetype</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash of the default theme.
      try {
        var t = JSON.parse(localStorage.getItem('cubetype.themeColors') || 'null');
        if (t) for (var k in t) document.documentElement.style.setProperty(k, t[k]);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
