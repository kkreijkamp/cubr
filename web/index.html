<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="cubr - a minimal, fast speedcubing timer with stats, leaderboards, daily challenges and live races." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- the installable app (PWA): public/manifest.webmanifest, the service worker is src/sw/ -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="cubr" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>cubr</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash of the default theme.
      try {
        var t = JSON.parse(localStorage.getItem('cubr.themeColors') || 'null');
        if (t) for (var k in t) document.documentElement.style.setProperty(k, t[k]);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
