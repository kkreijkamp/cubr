<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="a minimalist speedcubing timer" />
    <!-- link previews (chat apps, social sites): the same card for every page, as crawlers don't run the app.
         public/og.png is drawn by web/scripts/pwa-assets.mjs og; no og:url, so a shared page links to itself -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="cubr" />
    <meta property="og:description" content="a minimalist speedcubing timer" />
    <meta property="og:image" content="https://cubr.dev/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="the cubr logo: a green cube face and the word cubr" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- the installable app (PWA): public/manifest.webmanifest, the service worker is src/sw/ -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="cubr" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>cubr</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash of the default theme.
      try {
        var t = JSON.parse(localStorage.getItem('cubr.themeColors') || 'null');
        if (t) for (var k in t) document.documentElement.style.setProperty(k, t[k]);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
