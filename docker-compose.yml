# =============================================================================================
# cubr -- full local stack (docker compose v2)
# ---------------------------------------------------------------------------------------------
#   docker compose up -d --build                 # build all images and start the whole stack
#   open http://localhost:8080                   # gateway = same routes as the GKE Ingress
#   docker compose up -d --scale solve=3         # 3 solve replicas; the gateway round-robins
#   docker compose logs -f gateway               # access log shows upstream=<container ip>
#   docker compose --profile jobs run --rm wca-import   # load the WCA public export
#   docker compose --profile jobs run --rm seed         # create demo users + solves
#   docker compose down                          # stop (add -v to also delete the volumes)
#
# The gateway is the only entry point for the app (http://localhost:8080). Postgres and Redis
# are also published, on 127.0.0.1 only and on non-default ports so a locally installed
# Postgres/Redis cannot clash: 55433 (psql postgres://cubr:cubr@localhost:55433/cubr)
# and 56380 (redis-cli -p 56380). The same ports let you run one service on the host:
#   DATABASE_URL=postgres://cubr:cubr@localhost:55433/cubr \
#   REDIS_URL=redis://localhost:56380 npm run dev -w services/auth
# Environment variables follow docs/SPEC.md section 4.
# =============================================================================================

name: cubr                           # compose project name -> containers cubr-<svc>-<n>

# ---- shared snippets (YAML anchors) -------------------------------------------------------------
x-service-env: &service-env
  DATABASE_URL: postgres://cubr:cubr@postgres:5432/cubr
  REDIS_URL: redis://redis:6379
  JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}   # override with JWT_SECRET=... docker compose up
  # Shared secret for /internal/* calls between services (X-Internal-Token); auth also lets the
  # seed job, which sends it too, skip its per-IP rate limits.
  INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token-0123456789}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  TRUST_PROXY_HOPS: 1                                # one reverse proxy (the gateway) in front -> req.ip = real client
  NODE_NAME: docker-compose                          # K8s sets this from spec.nodeName
  # POD_NAME is not set: services fall back to os.hostname() = the container id, which differs
  # per replica, so X-Served-By shows which replica answered.
  AUTH_URL: http://auth:8080
  SCRAMBLE_URL: http://scramble:8080
  SOLVE_URL: http://solve:8080
  STATS_URL: http://stats:8080
  LEADERBOARD_URL: http://leaderboard:8080
  WCA_URL: http://wca:8080
  RACE_URL: http://race:8080

x-service: &service
  restart: unless-stopped            # come back after crashes / docker restarts
  environment: *service-env
  healthcheck:                       # readiness = /readyz (deps reachable, migrations applied)
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 60s                # scramble/wca may need a while on first start
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

x-build-args: &build-args
  APP_VERSION: ${APP_VERSION:-dev}   # baked into the image -> X-Service: <svc>@<version>

services:
  # ---- data stores -----------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cubr
      POSTGRES_PASSWORD: cubr
      POSTGRES_DB: cubr
    volumes:
      - pgdata:/var/lib/postgresql/data   # survives `docker compose down` (use -v to wipe)
    ports:
      - "127.0.0.1:55433:5432"            # psql / services on the host: localhost:55433
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cubr -d cubr"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]   # AOF persistence (event stream, boards)
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:56380:6379"            # redis-cli / services on the host: localhost:56380
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---- microservices (build context = repo root: every image also needs packages/) ------------
  auth:
    <<: *service
    image: cubr/auth:dev              # local tag, built by `docker compose up --build`
    environment:
      <<: *service-env
      PUBLIC_URL: http://localhost:8080   # links in emails; no RESEND_API_KEY here -> emails are logged
    build: { context: ., dockerfile: services/auth/Dockerfile, args: *build-args }

  scramble:
    <<: *service
    image: cubr/scramble:dev
    build: { context: ., dockerfile: services/scramble/Dockerfile, args: *build-args }

  solve:
    <<: *service
    image: cubr/solve:dev
    build: { context: ., dockerfile: services/solve/Dockerfile, args: *build-args }

  stats:
    <<: *service
    image: cubr/stats:dev
    build: { context: ., dockerfile: services/stats/Dockerfile, args: *build-args }

  leaderboard:
    <<: *service
    image: cubr/leaderboard:dev
    build: { context: ., dockerfile: services/leaderboard/Dockerfile, args: *build-args }
    depends_on:                       # Redis-only service (rebuilds boards from stats over HTTP)
      redis: { condition: service_healthy }

  race:
    <<: *service
    image: cubr/race:dev
    build: { context: ., dockerfile: services/race/Dockerfile, args: *build-args }
    depends_on:                       # Redis-only service (room state + Socket.IO adapter)
      redis: { condition: service_healthy }

  wca:
    <<: *service
    image: cubr/wca:dev
    build: { context: ., dockerfile: services/wca/Dockerfile, args: *build-args }

  # ---- frontend ----------------------------------------------------------------------------------
  web:
    image: cubr/web:dev
    build: { context: ., dockerfile: web/Dockerfile, args: *build-args }
    restart: unless-stopped
    environment:
      NODE_NAME: docker-compose       # shown by /_info
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ---- gateway: local stand-in for the GKE Ingress ----------------------------------------------
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./deploy/gateway/nginx.conf:/etc/nginx/nginx.conf:ro   # routing rules (see file header)
    ports:
      - "8080:8080"                   # THE entry point: http://localhost:8080
    depends_on:
      # Only web is required; API services are resolved per request (Docker DNS), so the gateway
      # starts even if some of them are down and simply answers 502 JSON for their routes.
      web: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ---- one-off jobs (only with --profile jobs) ---------------------------------------------------
  # Equivalent of the K8s CronJob wca-import: downloads the WCA public export and loads it into
  # the `wca` schema (staging schema + atomic swap). Run: docker compose --profile jobs run --rm wca-import
  # Offline/faster variant: unzip an export to ./data/wca/tsv, then add
  #   -v "$PWD/data/wca/tsv:/data:ro" -e WCA_TSV_DIR=/data   to the `run` command.
  wca-import:
    profiles: ["jobs"]
    image: cubr/wca-import:dev
    build: { context: ., dockerfile: jobs/wca-import/Dockerfile, args: *build-args }
    restart: "no"
    environment:
      DATABASE_URL: postgres://cubr:cubr@postgres:5432/cubr
      FORCE: ${FORCE:-0}                         # 1 = re-import even if this export is already loaded
    depends_on:
      postgres: { condition: service_healthy }

  # Equivalent of the K8s Job seed: creates synthetic users + solves through the PUBLIC APIs
  # (so events flow through solve -> Redis -> stats/leaderboard exactly like real traffic).
  # It talks to the services directly via AUTH_URL / SOLVE_URL / SCRAMBLE_URL (jobs/seed/README.md).
  # Run: docker compose --profile jobs run --rm seed      (smaller: SEED_USERS=20 docker compose ...)
  seed:
    profiles: ["jobs"]
    image: cubr/seed:dev
    build: { context: ., dockerfile: jobs/seed/Dockerfile, args: *build-args }
    restart: "no"
    environment:
      AUTH_URL: http://auth:8080
      SOLVE_URL: http://solve:8080
      SCRAMBLE_URL: http://scramble:8080
      SEED_USERS: ${SEED_USERS:-150}             # synthetic users (+1 demo account)
      SEED_AVG_SOLVES: ${SEED_AVG_SOLVES:-650}   # average history per user (~100k solves total)
      SEED_CONCURRENCY: ${SEED_CONCURRENCY:-6}   # users seeded in parallel
      SEED_DEMO_USER: demo                       # demo account (local data)
      SEED_DEMO_PASSWORD: cubr-demo
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token-0123456789}   # must match auth's
    depends_on:
      auth: { condition: service_healthy }
      solve: { condition: service_healthy }
      scramble: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
