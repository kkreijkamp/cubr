<svg viewBox="0 0 760 404" width="760" height="404" font-size="12.4" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="cubetype architecture">
<!-- Figure 1 of the proposal. proposal.html shows it as fig1-architecture.png, so its labels do not
     count as proposal words. After editing, re-render the PNG: open this file in headless Chrome
     with a 760x404 window, device scale factor 4 and a white background, and take a screenshot. -->
<style>text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }</style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="arY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8920c"/></marker>
  </defs>
  <rect x="8" y="10" width="128" height="46" rx="7" fill="#fff" stroke="#333"/>
  <text x="72" y="29" text-anchor="middle" font-size="11" font-weight="600">Users</text>
  <text x="72" y="44" text-anchor="middle" font-size="8.5">browser / mobile</text>
  <line x1="136" y1="33" x2="190" y2="33" stroke="#333" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="163" y="47" text-anchor="middle" font-size="7.5">HTTP/WS</text>
  <rect x="192" y="10" width="200" height="46" rx="7" fill="#fdf6dc" stroke="#b8920c" stroke-width="1.4"/>
  <text x="292" y="28" text-anchor="middle" font-size="10.5" font-weight="600">Cloud Load Balancer (Ingress)</text>
  <text x="292" y="43" text-anchor="middle" font-size="8.3">static IP - L7 path routing - health checks</text>
  <rect x="470" y="10" width="120" height="40" rx="7" fill="#fff" stroke="#333"/>
  <text x="530" y="27" text-anchor="middle" font-size="10" font-weight="600">Cloud Build</text>
  <text x="530" y="41" text-anchor="middle" font-size="8">builds 10 images</text>
  <line x1="590" y1="30" x2="626" y2="30" stroke="#333" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="628" y="10" width="124" height="40" rx="7" fill="#fff" stroke="#333"/>
  <text x="690" y="27" text-anchor="middle" font-size="10" font-weight="600">Artifact Registry</text>
  <text x="690" y="41" text-anchor="middle" font-size="8">versioned images</text>
  <line x1="690" y1="50" x2="690" y2="94" stroke="#333" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="696" y="76" font-size="7.5">image pull</text>
  <line x1="292" y1="56" x2="292" y2="134" stroke="#b8920c" stroke-width="1.6" marker-end="url(#arY)"/>
  <text x="300" y="67" font-size="7.6" fill="#7a6008">/ -> web - /api/auth, /api/users -> auth - /api/scrambles -> scramble -</text>
  <text x="300" y="77" font-size="7.6" fill="#7a6008">/api/sessions, /api/solves -> solve - /api/stats -> stats - /api/leaderboards -></text>
  <text x="300" y="87" font-size="7.6" fill="#7a6008">leaderboard - /api/race, /socket.io -> race - /api/wca -> wca</text>
  <rect x="8" y="96" width="744" height="300" rx="10" fill="#f7f8fa" stroke="#555" stroke-dasharray="6 4"/>
  <text x="20" y="111" font-size="9.5" font-weight="600">GKE Standard cluster - 3 x e2-standard-2 - australia-southeast1-a</text>
  <text x="20" y="123" font-size="8">Deployments (>= 2 replicas spread over nodes) - HPA - PDBs - probes - rolling update / rollback</text>
  <g font-size="8">
    <g transform="translate(20,138)"><rect x="4" y="-4" width="82" height="58" rx="6" fill="#e9ebef" stroke="#999"/><rect width="82" height="58" rx="6" fill="#fff" stroke="#333"/><text x="41" y="19" text-anchor="middle" font-size="10.5" font-weight="600">web</text><text x="41" y="33" text-anchor="middle">nginx - React SPA</text><text x="41" y="45" text-anchor="middle">HPA 2-6</text></g>
    <g transform="translate(111,138)"><rect x="4" y="-4" width="82" height="58" rx="6" fill="#e9ebef" stroke="#999"/><rect width="82" height="58" rx="6" fill="#fff" stroke="#333"/><text x="41" y="19" text-anchor="middle" font-size="10.5" font-weight="600">auth</text><text x="41" y="33" text-anchor="middle">accounts - JWT</text><text x="41" y="45" text-anchor="middle">settings</text></g>
    <g transform="translate(202,138)"><rect x="4" y="-4" width="82" height="58" rx="6" fill="#e9ebef" stroke="#999"/><rect width="82" height="58" rx="6" fill="#fdf6dc" stroke="#b8920c" stroke-width="1.3"/><text x="41" y="19" text-anchor="middle" font-size="10.5" font-weight="600">scramble</text><text x="41" y="33" text-anchor="middle">cubing.js (CPU)</text><text x="41" y="45" text-anchor="middle">HPA 2-8</text></g>
    <g transform="translate(293,138)"><rect x="4" y="-4" width="82" height="58" rx="6" fill="#e9ebef" stroke="#999"/><rect width="82" height="58" rx="6" fill="#fff" stroke="#333"/><text x="41" y="19" text-anchor="middle" font-size="10.5" font-weight="600">solve</text><text x="41" y="33" text-anchor="middle">CRUD - import</text><text x="41" y="45" text-anchor="middle">outbox - HPA 2-6</text></g>
    <g transform="translate(384,138)"><rect x="4" y="-4" width="82" height="58" rx="6" fill="#e9ebef" stroke="#999"/><rect width="82" height="58" rx="6" fill="#fff" stroke="#333"/><text x="41" y="19" text-anchor="middle" font-size="10.5" font-weight="600">stats</text><text x="41" y="33" text-anchor="middle">PBs - heatmap</text><text x="41" y="45" text-anchor="middle">event consumer</text></g>
    <g transform="translate(475,138)"><rect x="4" y="-4" width="82" height="58" rx="6" fill="#e9ebef" stroke="#999"/><rect width="82" height="58" rx="6" fill="#fff" stroke="#333"/><text x="41" y="19" text-anchor="middle" font-size="10.5" font-weight="600">leaderboard</text><text x="41" y="33" text-anchor="middle">sorted sets</text><text x="41" y="45" text-anchor="middle">event consumer</text></g>
    <g transform="translate(566,138)"><rect x="4" y="-4" width="82" height="58" rx="6" fill="#e9ebef" stroke="#999"/><rect width="82" height="58" rx="6" fill="#fdf6dc" stroke="#b8920c" stroke-width="1.3"/><text x="41" y="19" text-anchor="middle" font-size="10.5" font-weight="600">race</text><text x="41" y="33" text-anchor="middle">Socket.IO rooms</text><text x="41" y="45" text-anchor="middle">HPA 2-6</text></g>
    <g transform="translate(657,138)"><rect x="4" y="-4" width="82" height="58" rx="6" fill="#e9ebef" stroke="#999"/><rect width="82" height="58" rx="6" fill="#fff" stroke="#333"/><text x="41" y="19" text-anchor="middle" font-size="10.5" font-weight="600">wca</text><text x="41" y="33" text-anchor="middle">ranks - records</text><text x="41" y="45" text-anchor="middle">percentiles</text></g>
  </g>
  <g stroke="#666" stroke-width="1.1" fill="none">
    <path d="M152 196 V222 M243 196 V222 M334 196 V222 M425 196 V222 M516 196 V222 M607 196 V222 M698 196 V222 M152 222 H698"/>
  </g>
  <text x="425" y="234" text-anchor="middle" font-size="7.6" fill="#555">SQL - Redis commands - internal HTTP between services (ClusterIP Services)</text>
  <line x1="199" y1="222" x2="199" y2="256" stroke="#666" stroke-width="1.1" marker-end="url(#ar)"/>
  <line x1="569" y1="222" x2="569" y2="256" stroke="#666" stroke-width="1.1" marker-end="url(#ar)"/>
  <rect x="40" y="258" width="318" height="74" rx="8" fill="#eef4ff" stroke="#2d539e" stroke-width="1.3"/>
  <text x="199" y="276" text-anchor="middle" font-size="10.5" font-weight="600">PostgreSQL 17 (CloudNativePG operator)</text>
  <text x="199" y="291" text-anchor="middle" font-size="8.3">primary + 2 streaming replicas - automatic failover</text>
  <text x="199" y="304" text-anchor="middle" font-size="8.3">schema per service: auth - solve (+ outbox) - stats - scramble - wca</text>
  <text x="199" y="317" text-anchor="middle" font-size="8.3">WCA export ~2.3 M rows in 7 tables + ~100k seeded solves</text>
  <rect x="398" y="258" width="342" height="74" rx="8" fill="#fdeeee" stroke="#b03a3a" stroke-width="1.3"/>
  <text x="569" y="276" text-anchor="middle" font-size="10.5" font-weight="600">Redis 7 (StatefulSet + PVC)</text>
  <text x="569" y="291" text-anchor="middle" font-size="8.3">Streams event bus: solve.created -> stats &amp; leaderboard</text>
  <text x="569" y="304" text-anchor="middle" font-size="8.3">leaderboard sorted sets - scramble pool - cache - rate limits</text>
  <text x="569" y="317" text-anchor="middle" font-size="8.3">race room state + Socket.IO pub/sub adapter (cross-pod)</text>
  <path d="M358 304 H396" stroke="#b8920c" stroke-width="1.6" fill="none" marker-end="url(#arY)"/>
  <text x="377" y="298" text-anchor="middle" font-size="7.5" fill="#7a6008">outbox</text>
  <rect x="40" y="344" width="318" height="40" rx="7" fill="#fff" stroke="#333"/>
  <text x="199" y="361" text-anchor="middle" font-size="9.5" font-weight="600">CronJob wca-import (weekly)</text>
  <text x="199" y="375" text-anchor="middle" font-size="8">downloads WCA export -> staging schema -> atomic swap</text>
  <line x1="199" y1="344" x2="199" y2="334" stroke="#333" stroke-width="1.1" marker-end="url(#ar)"/>
  <rect x="398" y="344" width="342" height="40" rx="7" fill="#fff" stroke="#333"/>
  <text x="569" y="361" text-anchor="middle" font-size="9.5" font-weight="600">Jobs: seed - loadgen</text>
  <text x="569" y="375" text-anchor="middle" font-size="8">synthetic users &amp; solves via the APIs - HPA load test</text>
</svg>