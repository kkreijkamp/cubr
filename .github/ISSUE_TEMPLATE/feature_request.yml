name: Idea
description: Something cubr could do, or do better
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What you're trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: How another timer does it, a sketch, links.
