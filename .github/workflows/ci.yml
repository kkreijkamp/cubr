name: CI

on: [push, pull_request]

# A newer push to the same branch makes the running check pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  services:
    name: Services, jobs and shared packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # throwaway Postgres and Redis for the integration suites (@cubr/testkit)
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (unit and integration)
        run: npm test
      - name: Bundle every service and the seed job
        run: npm run build:all

  web:
    name: Web app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npx vite build

  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Render every kustomization
        run: |
          for dir in $(find deploy/k8s -name kustomization.yaml -exec dirname {} \; | sort); do
            echo "kubectl kustomize $dir"
            kubectl kustomize "$dir" > /dev/null
          done
      - name: One release version in every deploy file
        # Every file that names the version must name the same one, and a vX.Y.Z tag must be that
        # version: images are pulled IfNotPresent, so new code pushed under an old tag would never
        # roll out (scripts/bump-version.sh keeps the files in step).
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            bash scripts/bump-version.sh --check "$GITHUB_REF_NAME"
          else
            bash scripts/bump-version.sh --check
          fi

  nginx:
    # A typo in either config takes the site down on the next deploy: check both with the
    # images production runs (the gateway's nginx.conf as is, the web template rendered the way
    # the web image renders it at start-up).
    name: nginx configs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Gateway (deploy/gateway/nginx.conf)
        run: docker run --rm -v "$PWD/deploy/gateway/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:1.27-alpine nginx -t
      - name: Web container (web/nginx/default.conf.template)
        run: >-
          docker run --rm -e APP_VERSION=ci -e NODE_NAME=ci
          -v "$PWD/web/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro"
          nginxinc/nginx-unprivileged:1.27-alpine
          sh -c '/docker-entrypoint.d/20-envsubst-on-templates.sh > /dev/null && nginx -t'

  image:
    # scramble and auth are the images that ship an npm package next to their bundle (cubing.js
    # here, sharp below), so they are the ones most likely to break when dependencies or a
    # Dockerfile change.
    name: Scramble image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -f services/scramble/Dockerfile -t cubr/scramble:ci .
      - name: cubing.js resolves inside the image
        run: docker run --rm cubr/scramble:ci node -e "import('cubing/scramble').then(() => console.log('cubing ok'))"

  auth-image:
    # auth re-encodes profile pictures with sharp, whose native libvips the Dockerfile installs for
    # the image's platform (amd64 here, as on Cloud Build).
    name: Auth image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -f services/auth/Dockerfile -t cubr/auth:ci .
      - name: sharp re-encodes a picture inside the image
        run: >-
          docker run --rm cubr/auth:ci node --input-type=module -e "const { default: sharp } = await import('sharp');
          const png = await sharp({ create: { width: 64, height: 32, channels: 3, background: '#00a04d' } }).png().toBuffer();
          const out = await sharp(png).resize(16, 16).webp().toBuffer();
          console.log('sharp ok', (await sharp(out).metadata()).format)"
