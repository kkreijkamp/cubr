# Cloud Build config that builds and pushes ONE image (e.g. web:1.1.0 for the rolling-update
# demo) instead of all ten. Submitted from the repo root:
#   gcloud builds submit --region=australia-southeast1 --config=deploy/cloudbuild/single-image.yaml \
#     --substitutions=_IMAGE=web,_DOCKERFILE=web/Dockerfile,_VERSION=1.1.0 .
# Substitutions: _IMAGE image name, _DOCKERFILE path relative to the repo root,
# _VERSION tag + APP_VERSION, _REGION/_REPO Artifact Registry location ($PROJECT_ID is automatic).
substitutions:
  _IMAGE: web
  _DOCKERFILE: web/Dockerfile
  _VERSION: 1.1.0
  _REGION: australia-southeast1
  _REPO: cubr

options:
  logging: CLOUD_LOGGING_ONLY
  env:
    - DOCKER_BUILDKIT=1

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=${_DOCKERFILE}
      - --build-arg=APP_VERSION=${_VERSION}
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:${_VERSION}
      - .

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:${_VERSION}
