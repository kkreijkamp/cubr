# =============================================================================================
# cubr local gateway (docker compose only)
# ---------------------------------------------------------------------------------------------
# Plays the role of the GKE Ingress (external Application Load Balancer) on a laptop: one
# entry point on http://localhost:8080 that routes by URL path prefix to the microservices,
# with EXACTLY the same rules as deploy/k8s/overlays/gke/ingress.yaml:
#
#   /api/auth, /api/users          -> auth:8080
#   /api/scrambles                 -> scramble:8080
#   /api/sessions, /api/solves     -> solve:8080
#   /api/stats                     -> stats:8080
#   /api/leaderboards              -> leaderboard:8080
#   /api/race, /socket.io          -> race:8080   (WebSocket upgrade, 1 h timeout)
#   /api/wca                       -> wca:8080
#   /internal/*                    -> 404 (service-to-service only, never public)
#   everything else                -> web:8080    (the SPA, like the Ingress defaultBackend)
#
# Like the Ingress, the gateway does NOT rewrite paths: services receive the full original
# path (e.g. /api/auth/login) and mount their routes under their own prefix.
#
# Why "resolver + variables" instead of static upstream blocks?
#   * With `proxy_pass http://auth:8080;` nginx resolves "auth" ONCE at start-up and refuses to
#     start if any service container is missing. With `set $svc auth; proxy_pass http://$svc:8080;`
#     the name is resolved at request time through Docker's embedded DNS server (127.0.0.11), so
#     the gateway starts even when some services are down (those routes answer 502 JSON instead).
#   * `valid=10s` caches DNS answers for 10 s only. Docker's DNS returns one A record per
#     container of a compose service, and nginx round-robins across all returned addresses.
#     So after `docker compose up -d --scale solve=3` the gateway picks up the new replicas
#     within ~10 s and load-balances between them -- watch the X-Served-By response header
#     (container hostname set by each service) or the X-Upstream header added below.
# =============================================================================================

worker_processes auto;                     # one worker per CPU core
error_log /dev/stderr warn;                # errors to the container log (docker compose logs gateway)
pid /tmp/nginx.pid;

events {
  worker_connections 4096;                 # max simultaneous connections per worker (WebSockets stay open)
}

http {
  server_tokens off;                       # don't advertise the nginx version
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65s;

  # access log shows which upstream container served each request (load-balancing evidence)
  log_format gateway '$remote_addr "$request" $status $body_bytes_sent '
                     'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';
  access_log /dev/stdout gateway;

  # Docker's embedded DNS; re-resolve every 10 s so scaled/restarted containers are picked up.
  # ipv6=off: compose networks are IPv4-only by default.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 2s;

  # Body limit for csTimer imports (SPEC section 9.3: import body <= 25 MB).
  client_max_body_size 25m;

  # WebSocket support: forward "Connection: upgrade" only when the client asked for an upgrade.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 8080;                           # published to the host as localhost:8080 (docker-compose.yml)
    server_name _;

    # ---- headers sent to every backend -----------------------------------------------------
    proxy_http_version 1.1;                                       # needed for keep-alive + WebSockets
    proxy_set_header Host              $host;                     # keep the public host name
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for; # Fastify trustProxy -> req.ip (rate limits)
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;              # fail fast if a container is gone
    proxy_read_timeout    120s;            # long enough for a 100k-solve csTimer import
    proxy_send_timeout    120s;

    # Upstream response headers such as X-Served-By / X-Service (set by every service, see
    # packages/common/src/server.ts) are passed through untouched. We additionally expose the
    # container IP:port nginx picked, which makes round-robin visible during `--scale` demos.
    add_header X-Upstream $upstream_addr always;

    # ---- nginx-generated errors -> SPEC section 5 JSON error envelope --------------------------------
    # Only errors produced by the gateway itself (service not running / not resolvable / timeout)
    # are rewritten; error responses produced by the services are passed through unchanged.
    error_page 502 @bad_gateway;
    error_page 504 @gateway_timeout;

    location @bad_gateway {
      default_type application/json;
      add_header Cache-Control "no-store" always;
      return 502 '{"error":{"code":"UNAVAILABLE","message":"Service unavailable (gateway could not reach the backend)"}}';
    }
    location @gateway_timeout {
      default_type application/json;
      add_header Cache-Control "no-store" always;
      return 504 '{"error":{"code":"UNAVAILABLE","message":"Backend timed out"}}';
    }

    # ---- /internal/* is never routed publicly (SPEC section 3) --------------------------------------
    # nginx normalises the URI (decodes %XX, resolves ../) before matching locations, so
    # tricks like /api/solves/../../internal/x also end up here. ^~ stops regex matching.
    location ^~ /internal/ {
      default_type application/json;
      return 404 '{"error":{"code":"NOT_FOUND","message":"Not found"}}';
    }
    location = /internal {
      default_type application/json;
      return 404 '{"error":{"code":"NOT_FOUND","message":"Not found"}}';
    }

    # ---- API routes ----------------------------------------------------------------------------
    # Regexes mirror the Ingress "pathType: Prefix" semantics: /api/auth matches /api/auth and
    # /api/auth/... but NOT /api/authx. Each location stores the compose service name in a
    # variable so it is resolved per request (see header comment).

    location ~ ^/api/(auth|users)(/|$) {
      set $svc auth;
      proxy_pass http://$svc:8080;         # no URI part -> the original request URI is forwarded as-is
    }

    location ~ ^/api/scrambles(/|$) {
      set $svc scramble;
      proxy_pass http://$svc:8080;
    }

    location ~ ^/api/(sessions|solves)(/|$) {
      set $svc solve;
      proxy_pass http://$svc:8080;
    }

    location ~ ^/api/stats(/|$) {
      set $svc stats;
      proxy_pass http://$svc:8080;
    }

    location ~ ^/api/leaderboards(/|$) {
      set $svc leaderboard;
      proxy_pass http://$svc:8080;
    }

    location ~ ^/api/wca(/|$) {
      set $svc wca;
      proxy_pass http://$svc:8080;
    }

    location ~ ^/api/race(/|$) {
      set $svc race;
      proxy_pass http://$svc:8080;
    }

    # Socket.IO (race rooms). The client uses transports:["websocket"], so a single upgraded
    # connection carries the whole race; no sticky sessions needed (state lives in Redis).
    location ~ ^/socket\.io(/|$) {
      set $svc race;
      proxy_set_header Upgrade    $http_upgrade;        # pass the WebSocket handshake through
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;                          # keep idle sockets open for 1 h (same as GKE race BackendConfig)
      proxy_send_timeout 3600s;
      proxy_buffering off;                               # push frames immediately
      proxy_pass http://$svc:8080;
    }

    # ---- everything else: the React SPA (Ingress defaultBackend = web) -------------------------
    location / {
      set $svc web;
      proxy_pass http://$svc:8080;
    }
  }
}
