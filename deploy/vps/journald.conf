# The VM's journal (installed by deploy.sh as /etc/systemd/journald.conf.d/cubr.conf). It holds the
# containers' logs too (compose.prod.yml logs to journald), the gateway's access log with visitors'
# IP addresses among them: kept at most 14 days, and 500 MB, as the privacy policy says.
[Journal]
SystemMaxUse=500M
MaxRetentionSec=14day
