# Local-only gateway (kind has no cloud load balancer): nginx with the routing table of the
# docker compose gateway, exposed as NodePort 30080 -> http://localhost:8090 thanks to the kind
# extraPortMappings (deploy/k8s/kind/kind-config.yaml). Alternative without the port mapping:
#   kubectl -n cubetype port-forward svc/gateway 8090:80
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: cubetype
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: cubetype
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine   # same base as the web image (already cached)
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /gateway/healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /gateway/healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          volumeMounts:
            - name: config              # our nginx.conf replaces the image's main config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: config
          configMap:
            name: gateway-nginx         # generated by kustomize from gateway-nginx.conf (name gets a content hash)
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: cubetype
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080                   # mapped to localhost:8090 by kind
