# Local overlay for kind (Kubernetes-in-Docker on the laptop):
#   kubectl apply -k deploy/k8s/overlays/local
# * images: the base names cubetype/<svc>:dev are kept -> built by scripts/build-local.sh and
#   copied into the kind nodes with `kind load docker-image` (imagePullPolicy IfNotPresent)
# * no Google load balancer: an nginx "gateway" Deployment + NodePort Service replaces the Ingress
# * smaller PostgreSQL footprint
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cubetype
resources:
  - ../../base
  - gateway.yaml

configMapGenerator:
  - name: gateway-nginx                 # content-hashed name: editing the file rolls the gateway automatically
    files:
      - nginx.conf=gateway-nginx.conf

patches:
  - path: postgres-local.yaml
