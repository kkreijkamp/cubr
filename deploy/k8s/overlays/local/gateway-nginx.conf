# =============================================================================================
# cubetype gateway for the LOCAL Kubernetes cluster (kind) -- stands in for the GKE Ingress.
# Same routing table as deploy/gateway/nginx.conf (docker compose) and overlays/gke/ingress.yaml:
#   /api/auth,/api/users -> auth   /api/scrambles -> scramble   /api/sessions,/api/solves -> solve
#   /api/stats -> stats   /api/leaderboards -> leaderboard   /api/race,/socket.io -> race
#   /api/wca -> wca       /internal/* -> 404                 everything else -> web
#
# Difference to the compose version: static upstreams. Kubernetes Services have stable
# ClusterIPs that exist as soon as the Service is created (even with 0 ready pods), so nginx
# resolves e.g. "auth" once at start-up (via the pod's resolv.conf search path ->
# auth.cubetype.svc.cluster.local) and kube-proxy load-balances every new connection over the
# ready pods behind that ClusterIP. Scaling therefore needs no DNS re-resolution here.
# =============================================================================================
worker_processes 2;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;                       # writable path (read-only root filesystem)

events {
  worker_connections 4096;
}

http {
  server_tokens off;
  default_type application/octet-stream;
  keepalive_timeout 65s;

  # temp files under /tmp (emptyDir) because the root filesystem is read-only
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  log_format gateway '$remote_addr "$request" $status $body_bytes_sent '
                     'upstream=$upstream_addr rt=$request_time';
  access_log /dev/stdout gateway;

  client_max_body_size 25m;               # csTimer imports (SPEC §9.3)

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 8080;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout    120s;
    proxy_send_timeout    120s;

    # gateway's own health endpoint for its probes (does not depend on any backend)
    location = /gateway/healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    error_page 502 @bad_gateway;
    error_page 504 @gateway_timeout;
    location @bad_gateway {
      default_type application/json;
      return 502 '{"error":{"code":"UNAVAILABLE","message":"Service unavailable (gateway could not reach the backend)"}}';
    }
    location @gateway_timeout {
      default_type application/json;
      return 504 '{"error":{"code":"UNAVAILABLE","message":"Backend timed out"}}';
    }

    location ^~ /internal/ {
      default_type application/json;
      return 404 '{"error":{"code":"NOT_FOUND","message":"Not found"}}';
    }
    location = /internal {
      default_type application/json;
      return 404 '{"error":{"code":"NOT_FOUND","message":"Not found"}}';
    }

    location ~ ^/api/(auth|users)(/|$)      { proxy_pass http://auth:8080; }
    location ~ ^/api/scrambles(/|$)         { proxy_pass http://scramble:8080; }
    location ~ ^/api/(sessions|solves)(/|$) { proxy_pass http://solve:8080; }
    location ~ ^/api/stats(/|$)             { proxy_pass http://stats:8080; }
    location ~ ^/api/leaderboards(/|$)      { proxy_pass http://leaderboard:8080; }
    location ~ ^/api/wca(/|$)               { proxy_pass http://wca:8080; }
    location ~ ^/api/race(/|$)              { proxy_pass http://race:8080; }

    location ~ ^/socket\.io(/|$) {
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
      proxy_pass http://race:8080;
    }

    location / { proxy_pass http://web:8080; }
  }
}
