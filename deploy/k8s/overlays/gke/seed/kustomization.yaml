# Seed Job with the Artifact Registry image:  kubectl apply -k deploy/k8s/overlays/gke/seed
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cubr
resources:
  - ../../../jobs/seed
images:
  - name: cubr/seed
    newName: australia-southeast1-docker.pkg.dev/cubr-app/cubr/seed
    newTag: "1.6.39"
