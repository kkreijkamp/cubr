# GKE overlay: the base + everything specific to Google Kubernetes Engine.
#   kubectl apply -k deploy/k8s/overlays/gke
# * images from Artifact Registry (australia-southeast1-docker.pkg.dev/cubr-app/cubr/<svc>:<tag>)
# * GKE Ingress (external Application Load Balancer) on the reserved global IP "cubr-ip"
# * one BackendConfig per backend (LB health check on /readyz, connection draining, race timeout)
# * container-native load balancing (NEG annotations on every Service)
# * PersistentVolumes on standard-rwo (pd-balanced) and a 3-instance PostgreSQL cluster
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cubr
resources:
  - ../../base
  - backendconfigs.yaml
  - ingress.yaml

# Rewrite the neutral image names of the base. The tags are the release version: every commit
# bumps it (scripts/bump-version.sh, run by .githooks/pre-commit) and is tagged vX.Y.Z, so don't
# edit them by hand and never reuse one: images are pulled IfNotPresent, so nodes would keep
# running the old image under a reused tag.
images:
  - name: cubr/auth
    newName: australia-southeast1-docker.pkg.dev/cubr-app/cubr/auth
    newTag: "1.6.5"
  - name: cubr/scramble
    newName: australia-southeast1-docker.pkg.dev/cubr-app/cubr/scramble
    newTag: "1.6.5"
  - name: cubr/solve
    newName: australia-southeast1-docker.pkg.dev/cubr-app/cubr/solve
    newTag: "1.6.5"
  - name: cubr/stats
    newName: australia-southeast1-docker.pkg.dev/cubr-app/cubr/stats
    newTag: "1.6.5"
  - name: cubr/leaderboard
    newName: australia-southeast1-docker.pkg.dev/cubr-app/cubr/leaderboard
    newTag: "1.6.5"
  - name: cubr/race
    newName: australia-southeast1-docker.pkg.dev/cubr-app/cubr/race
    newTag: "1.6.5"
  - name: cubr/wca
    newName: australia-southeast1-docker.pkg.dev/cubr-app/cubr/wca
    newTag: "1.6.5"
  - name: cubr/web
    newName: australia-southeast1-docker.pkg.dev/cubr-app/cubr/web
    newTag: "1.6.5"
  - name: cubr/wca-import
    newName: australia-southeast1-docker.pkg.dev/cubr-app/cubr/wca-import
    newTag: "1.6.5"

patches:
  # Behind the Google load balancer X-Forwarded-For is "<client-ip>, <lb-ip>" -> trust 2 hops.
  - path: config-gke.yaml
  # Service annotations for the Ingress: NEG = the load balancer sends traffic straight to pod
  # IPs (no extra kube-proxy hop) and health-checks each pod; backend-config = which
  # BackendConfig (health check / timeouts / draining) applies to that Service.
  - path: service-annotations.yaml
  # PostgreSQL: 3 instances (1 primary + 2 replicas, one per node) on pd-balanced disks.
  - path: postgres-gke.yaml
  # Redis PVC on pd-balanced.
  - path: redis-gke.yaml
