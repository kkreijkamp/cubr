# Strategic-merge patches that add GKE Ingress annotations to the base Services.
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "auth"}'
