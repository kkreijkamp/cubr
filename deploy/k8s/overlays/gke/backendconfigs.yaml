# BackendConfig = GKE-specific settings of each load-balancer backend (one per Service).
#   healthCheck        the LB probes every pod (NEG) on /readyz:8080 -- the same endpoint as the
#                      readinessProbe -- so pods whose dependencies are down get no traffic
#   connectionDraining after a pod leaves the backend (rollout, scale-in), in-flight requests
#                      get up to 30 s to finish (pods also sleep 10 s in preStop)
#   timeoutSec         max time for a backend response (default 30 s). race: 3600 s, because
#                      the classic ALB closes WebSockets (even active ones) when it expires.
#                      solve: 120 s for large csTimer imports.
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: auth
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/part-of: cubetype
spec:
  timeoutSec: 30
  connectionDraining:
    drainingTimeoutSec: 30
  healthCheck:
    type: HTTP
    requestPath: /readyz
    port: 8080                          # must equal the containerPort (NEG mode)
    checkIntervalSec: 5
    timeoutSec: 3
    healthyThreshold: 1
    unhealthyThreshold: 2
