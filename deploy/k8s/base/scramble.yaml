# =============================================================================================
# scramble: WCA random-state scrambles with cubing.js, pooled in Redis; daily challenge (/api/scrambles)
# CPU-bound: one pod saturates ~1 core (1 cubing.js search worker, ~4-5 fresh 4x4 req/s) at
# 165-240 MB RSS -> request 250m (HPA % is relative to it, so it scales out visibly), limit 1 CPU.
# HPA 2-8 replicas (hpa.yaml). Probes are more tolerant: warm-up ~15 s, slower when throttled.
# Objects: Deployment (2 replicas, zero-downtime rolling updates) + ClusterIP Service on port
# 8080 (keeps SPEC's internal URL http://scramble:8080 working) + PodDisruptionBudget.
# =============================================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scramble
  labels:
    app.kubernetes.io/name: scramble
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: cubetype
spec:
  # no `replicas:` -- the HorizontalPodAutoscaler (hpa.yaml) owns the count (min 2). Leaving it out
  # means `kubectl apply` never resets a scaled-out Deployment back to 2 in the middle of a demo.
  revisionHistoryLimit: 10              # old ReplicaSets kept for `kubectl rollout undo --to-revision`
  minReadySeconds: 5                    # a new pod must stay Ready 5 s before the rollout continues
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1                       # start 1 extra new pod at a time...
      maxUnavailable: 0                 # ...and never drop below the desired number of ready pods
  selector:
    matchLabels:
      app.kubernetes.io/name: scramble
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scramble
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: cubetype
    spec:
      automountServiceAccountToken: false   # the app never talks to the Kubernetes API
      terminationGracePeriodSeconds: 30     # preStop 10 s + up to 20 s graceful shutdown (common/start())
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000                 # the "node" user of node:22-alpine (numeric so runAsNonRoot can verify it)
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1                    # replicas spread evenly over nodes -> a node failure takes out at most ~half
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway   # prefer spreading, but never leave a pod Pending because of it
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: scramble
          matchLabelKeys: ["pod-template-hash"]   # spread each ReplicaSet (rollout) separately
      containers:
        - name: scramble
          image: cubetype/scramble:dev    # rewritten per overlay (GKE: Artifact Registry, tag set in overlays/gke)
          imagePullPolicy: IfNotPresent
          # APP_VERSION is baked into the image at build time (--build-arg) and deliberately not overridden here.
          envFrom:
            - configMapRef:
                name: cubetype-config   # REDIS_URL, LOG_LEVEL, *_URL service addresses
          env:
            - name: JWT_SECRET          # shared HS256 signing key
              valueFrom:
                secretKeyRef:
                  name: cubetype-secrets
                  key: JWT_SECRET
            - name: DATABASE_URL        # connection string generated by CloudNativePG (points at pg-rw)
              valueFrom:
                secretKeyRef:
                  name: pg-app
                  key: uri
            - name: POD_NAME            # downward API -> X-Served-By header / status page
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME           # downward API -> which node served the request
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http
              containerPort: 8080
          startupProbe:                 # allow up to 60 s for the process to start listening
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:               # gate traffic on dependencies (Postgres/Redis) -- 503 removes the pod from the Service
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:                # restart only if the process itself hangs (never checks dependencies)
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          lifecycle:
            preStop:                    # keep serving for 10 s while endpoints/load balancers drop this pod
              exec:
                command: ["sleep", "10"]
          resources:
            requests:                   # what the scheduler reserves (and what HPA % is relative to)
              cpu: 250m
              memory: 256Mi
            limits:                     # hard caps: CPU is throttled, memory over the limit = OOMKill
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp           # the only writable path (root filesystem is read-only)
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: scramble
  labels:
    app.kubernetes.io/name: scramble
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: cubetype
spec:
  type: ClusterIP                       # internal virtual IP; kube-proxy load-balances over ready pods
  selector:
    app.kubernetes.io/name: scramble
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: scramble
  labels:
    app.kubernetes.io/name: scramble
    app.kubernetes.io/part-of: cubetype
spec:
  minAvailable: 1                       # `kubectl drain` / node upgrades may never evict the last ready pod
  selector:
    matchLabels:
      app.kubernetes.io/name: scramble
