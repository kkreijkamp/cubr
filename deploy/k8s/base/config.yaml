# Non-secret configuration shared by all microservices (docs/SPEC.md section 4), injected with
# envFrom. Secrets live elsewhere:
#   * cubetype-secrets (keys JWT_SECRET, INTERNAL_API_TOKEN) -- created by scripts/commands.sh section 8, never committed
#   * pg-app (key uri -> DATABASE_URL)  -- generated by the CloudNativePG operator for Cluster "pg"
# Service URLs use the short Service names; Kubernetes DNS resolves them inside the namespace.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cubetype-config
  labels:
    app.kubernetes.io/part-of: cubetype
data:
  LOG_LEVEL: info
  # Reverse-proxy hops in front of the pods whose X-Forwarded-For entries are trusted for
  # req.ip (login rate limiting). 1 = one proxy (local nginx gateway); the GKE overlay sets 2
  # (client -> Google Front End / load balancer -> pod, Google appends client-ip and lb-ip).
  TRUST_PROXY_HOPS: "1"
  REDIS_URL: redis://redis:6379
  AUTH_URL: http://auth:8080
  SCRAMBLE_URL: http://scramble:8080
  SOLVE_URL: http://solve:8080
  STATS_URL: http://stats:8080
  LEADERBOARD_URL: http://leaderboard:8080
  WCA_URL: http://wca:8080
  RACE_URL: http://race:8080
