# =============================================================================================
# auth: accounts, JWT login/registration, settings, profiles (routes /api/auth, /api/users)
# bcrypt (cost 10) is CPU-bound, hence the 500m burst limit.
# Objects: Deployment (2 replicas) + ClusterIP Service on port 8080 (keeps SPEC's internal URL
# http://auth:8080 working).
# =============================================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: cubetype
spec:
  replicas: 2                           # >= 2 so one pod can die/roll without downtime
  selector:
    matchLabels:
      app.kubernetes.io/name: auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: cubetype
    spec:
      containers:
        - name: auth
          image: cubetype/auth:dev
          imagePullPolicy: IfNotPresent
          # APP_VERSION is baked into the image at build time (--build-arg) and deliberately not overridden here.
          envFrom:
            - configMapRef:
                name: cubetype-config   # REDIS_URL, LOG_LEVEL, *_URL service addresses
          env:
            - name: JWT_SECRET          # shared HS256 signing key
              valueFrom:
                secretKeyRef:
                  name: cubetype-secrets
                  key: JWT_SECRET
            - name: DATABASE_URL        # connection string generated by CloudNativePG (points at pg-rw)
              valueFrom:
                secretKeyRef:
                  name: pg-app
                  key: uri
            - name: POD_NAME            # downward API -> X-Served-By header / status page
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME           # downward API -> which node served the request
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:               # gate traffic on dependencies (Postgres/Redis) -- 503 removes the pod from the Service
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:                # restart only if the process itself hangs (never checks dependencies)
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:                   # what the scheduler reserves
              cpu: 50m
              memory: 96Mi
            limits:                     # hard caps: CPU is throttled, memory over the limit = OOMKill
              cpu: "500m"
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: cubetype
spec:
  type: ClusterIP                       # internal virtual IP; kube-proxy load-balances over ready pods
  selector:
    app.kubernetes.io/name: auth
  ports:
    - name: http
      port: 8080
      targetPort: http
