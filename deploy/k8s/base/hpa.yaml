# HorizontalPodAutoscalers (autoscaling/v2): add/remove pods based on average CPU usage
# relative to the pod's CPU *request* (e.g. scramble requests 250m, target 60% => scale out when
# pods average > 150m). metrics-server provides the numbers (pre-installed on GKE).
# The behavior block is tuned for a live demo: scale up immediately (no stabilization, up to
# +100% or +2 pods every 15 s), scale down after only 60 s of low load (default is 300 s).
# NOTE: these Deployments have no spec.replicas (the HPA owns the count; a fresh Deployment starts
# with 1 pod and the HPA raises it to minReplicas within seconds). Change capacity via min/max
# here, not with `kubectl scale` (the HPA would undo it).
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: scramble
  labels:
    app.kubernetes.io/name: scramble
    app.kubernetes.io/part-of: cubetype
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: scramble
  minReplicas: 2                        # never below 2 (availability)
  maxReplicas: 8                     # upper bound (cost / cluster capacity)
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60       # % of the CPU request -- CPU-bound scramble generation, the HPA demo target
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0     # react at once
      selectPolicy: Max                 # use whichever policy allows the bigger step
      policies:
        - type: Percent
          value: 100                    # double...
          periodSeconds: 15
        - type: Pods
          value: 2                      # ...or +2 pods per 15 s
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 60    # wait 60 s of low load before removing pods
      policies:
        - type: Pods
          value: 1                      # remove 1 pod per 30 s (gentle)
          periodSeconds: 30
---
