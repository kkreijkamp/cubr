# On-demand Job: creates synthetic users + solves through the PUBLIC service APIs (jobs/seed),
# so the data flows exactly like real traffic: solve -> outbox -> Redis Stream -> stats/leaderboard.
# Not part of the base; applied through the overlay-specific wrapper (image rewrite):
#   kubectl apply -k deploy/k8s/overlays/gke/seed      (GKE)
#   kubectl apply -k deploy/k8s/overlays/local/seed    (kind)
# Jobs are immutable: to run it again, `kubectl -n cubetype delete job seed` first.
apiVersion: batch/v1
kind: Job
metadata:
  name: seed
  labels:
    app.kubernetes.io/name: seed
    app.kubernetes.io/component: batch
    app.kubernetes.io/part-of: cubetype
spec:
  backoffLimit: 2                       # writes are idempotent (existing users are skipped), so retries are safe
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 86400        # auto-delete one day after it finished
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seed
        app.kubernetes.io/component: batch
        app.kubernetes.io/part-of: cubetype
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000                 # "node" user of node:22-alpine
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: cubetype/seed:dev      # rewritten by the overlay wrapper
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: cubetype-config   # AUTH_URL, SOLVE_URL, SCRAMBLE_URL = in-cluster service addresses
          env:
            - name: INTERNAL_API_TOKEN  # sent as X-Internal-Token so auth skips its per-IP rate limits for the seeder
              valueFrom:
                secretKeyRef:
                  name: cubetype-secrets
                  key: INTERNAL_API_TOKEN
            # tuning knobs (jobs/seed/README.md)
            - name: SEED_USERS          # synthetic users (+1 demo account)
              value: "150"
            - name: SEED_AVG_SOLVES     # average history per user (150 x 650 ~= 100k solves)
              value: "650"
            - name: SEED_CONCURRENCY    # users seeded in parallel
              value: "6"
            - name: SEED_DEMO_USER      # presentation account
              value: demo
            - name: SEED_DEMO_PASSWORD
              value: cubetype-demo
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
