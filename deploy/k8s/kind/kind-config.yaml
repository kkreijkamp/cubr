# kind (Kubernetes-in-Docker) cluster used to test the manifests locally before GKE.
# Create with:
#   kind create cluster --config deploy/k8s/kind/kind-config.yaml --kubeconfig "$KUBECONFIG"
# One control-plane + two workers so topologySpreadConstraints / PDBs / drain can be shown
# with pods spread over two "nodes" (each node is a Docker container).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cubetype
nodes:
  - role: control-plane
    # Expose the local gateway's NodePort (30080, see overlays/local/gateway.yaml) on the host
    # as http://localhost:8090 so the stack is reachable without a port-forward. 8090 (not 8080)
    # avoids clashing with the docker compose gateway.
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8090
        listenAddress: "127.0.0.1"
        protocol: TCP
  - role: worker
  - role: worker
